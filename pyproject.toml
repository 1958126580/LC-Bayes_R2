[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lcbayes-r2"
version = "2.0.0"
description = "Selection-aware fetal-maternal variance components for dairy cattle genomic prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "LC-Bayes R2 Consortium"},
]
keywords = [
    "genomic-prediction",
    "bayesian-statistics",
    "dairy-cattle",
    "variance-components",
    "hidden-markov-model",
    "computational-biology",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/1958126580/LC-Bayes-R2"
Repository = "https://github.com/1958126580/LC-Bayes-R2"
Documentation = "https://1958126580.github.io/LC-Bayes-R2"
Issues = "https://github.com/1958126580/LC-Bayes-R2/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
